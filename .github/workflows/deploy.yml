name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages and mint an id-token for it.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public OAuth Web client ID. Safe to expose in the built bundle, so
          # it is stored as a repo *variable* (Settings -> Secrets and variables
          # -> Actions -> Variables), not a secret.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      # Install the browser used by the headless smoke check.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Fail the workflow (so nothing deploys) if the built site does not render
      # or throws any console error / uncaught exception / failed request.
      # This is the gate that catches the "Invalid or unexpected token" class of
      # crash (untranspiled decorator/accessor syntax reaching the browser).
      - name: Smoke test built site
        run: npm run smoke

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
